<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Exemplo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">


        <div class="left">
            <img src="https://raw.githubusercontent.com/IFPR-Desenvolvimento-Web/Formularios-atividade/refs/heads/main/market.webp"
                alt="Imagem">
        </div>

        <div class="right">

            <form>

                <h2>Cadastre-se</h2>

                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Nome completo">
                </div>

                <div class="form-group">
                    <label for="data">Data de Nascimento:</label>
                    <input type="date" id="data">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group checkbox-group">

                    <label>Habilidades:</label>

                    <label><input type="checkbox"> HTML</label>
                    <label><input type="checkbox"> CSS</label>
                    <label><input type="checkbox"> JavaScript</label>
                    <label><input type="checkbox"> PHP</label>

                </div>

                <div class="form-group">
                    <label for="pais">País:</label>

                    <select id="pais">
                        <option>Brasil</option>
                        <option>Argentina</option>
                        <option>Chile</option>
                        <option>Paraguai</option>
                        <option>Uruguai</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="curriculo">Upload de Currículo:</label>
                    <input type="file" id="curriculo">
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentários:</label>
                    <textarea id="comentarios"></textarea>
                </div>

                <button type="submit">Enviar</button>

            </form>

        </div>

    </div>

</body>
